# Scenario 8: Service with no endpoints because its selector matches no pods.
# The bug: the Service selects app=checkout, but the pods have app=checkout-service.
# The pods themselves are healthy, so the fault is only visible on the Service.
apiVersion: v1
kind: Namespace
metadata:
  name: service-selector-mismatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: service-selector-mismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo ok > /www/index.html
              echo "listening on port 8080"
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: service-selector-mismatch
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 8080
