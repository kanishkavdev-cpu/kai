# Scenario 7: Pending PVC, and a Pending pod, because the StorageClass doesn't exist.
# The bug: the PVC asks for "fast-ssd", but this cluster only has "standard".
apiVersion: v1
kind: Namespace
metadata:
  name: pvc-missing-storageclass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkout-data
  namespace: pvc-missing-storageclass
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: pvc-missing-storageclass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo started; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: checkout-data
