# Scenario 1: CrashLoopBackOff because a required env var is missing.
# The bug: the app needs DATABASE_URL, but the Deployment never sets it.
apiVersion: v1
kind: Namespace
metadata:
  name: imagepull-bad-tag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: imagepull-bad-tag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: busybox:1.36-typo
          command: ["sh", "-c", "echo started; sleep 3600"]
