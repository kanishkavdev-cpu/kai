# Scenario 3: ImagePullBackOff because there's a typo in the image tag
# The bug: busybox:1.36-typo doesn't exist. The correct tag is busybox:1.36.
apiVersion: v1
kind: Namespace
metadata:
  name: imagepull-bad-tag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: imagepull-bad-tag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: busybox:1.36-typo
          command: ["sh", "-c", "echo started; sleep 3600"]
