# Scenario 1: CrashLoopBackOff because a required env var is missing.
# The bug: the app needs DATABASE_URL, but the Deployment never sets it.
apiVersion: v1
kind: Namespace
metadata:
  name: crash-missing-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: crash-missing-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "connected to database"
              sleep 3600
