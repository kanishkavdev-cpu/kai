# Single-node lab cluster for kai. The image is pinned by digest so every run
# gets the same Kubernetes version, even after kind is upgraded.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Slower in my machine
# Slow machines can need more than kubeadm's default of about 60 seconds for the
# API server to start. These are upper limits, so fast machines don't wait longer.
kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    timeouts:
      kubernetesAPICall: 5m0s
      controlPlaneComponentHealthCheck: 5m0s
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
